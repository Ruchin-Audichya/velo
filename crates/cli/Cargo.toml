[package]
name = "velo-cli"
description = "Lightweight, scriptable WhatsApp CLI for Velo powered by usage-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "velo-cli"
path = "src/main.rs"

[dependencies]
velo-ipc = { workspace = true }
velo-wire = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
usage-rs = { workspace = true }

# `CREATE_NO_WINDOW`, so a daemon the CLI starts does not pop a console window
# of its own. The same flag the window's own launch passes.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
# The surface tests parse the JSON contract the binary prints.
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
