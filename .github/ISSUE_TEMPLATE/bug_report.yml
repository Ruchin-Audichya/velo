name: Bug report
description: Something in Velo doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Please leave out phone numbers, names and message text.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a group chat
        2. Right-click a message
        3. ...
  - type: input
    id: version
    attributes:
      label: Velo version
      description: Settings → About, or the installer's file name.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Blur anything private.
