# Linux packages: a .deb for Ubuntu and Debian, a .rpm for Fedora, and a
# portable .tar.gz, each installed and started on the distribution it is for.
#
# Manual and read-only: it builds and tests, and leaves the packages as the
# run's artifacts. Attaching them to a release is a separate, deliberate step.
name: Linux packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
        type: string
      version:
        description: Version for the package names, e.g. 1.3.1
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # 22.04: the binaries link against this glibc (2.35), so anything at
    # least this new runs them: Ubuntu 22.04+, Debian 12+, Fedora 36+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.100.0"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev \
            dpkg-dev rpm

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: protoc

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: linux-packages
          cache-targets: "false"

      - name: Build
        run: cargo build --release --locked --bin velo --bin velod --bin velo-cli

      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: bash packaging/linux/build-packages.sh "$VERSION" target/release dist

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velo-linux
          path: dist/*
          if-no-files-found: error

  # Install each package the way a person would, on a clean system, then
  # check the binaries load and the window starts and stays up.
  install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu:22.04
            kind: deb
          - distro: ubuntu:24.04
            kind: deb
          - distro: debian:12
            kind: deb
          - distro: fedora:latest
            kind: rpm
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: velo-linux
          path: dist

      - name: Install the package
        run: |
          set -eux
          if [ "${{ matrix.kind }}" = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/velo_*.deb xvfb xauth mesa-vulkan-drivers procps
          else
            dnf install -y ./dist/velo-*.rpm xorg-x11-server-Xvfb xorg-x11-xauth mesa-vulkan-drivers procps-ng which
          fi

      - name: Every library the binaries link is present
        run: |
          set -eu
          for binary in velo velod velo-cli; do
            path=$(command -v "$binary")
            if ldd "$path" | grep 'not found'; then
              echo "$binary is missing libraries" >&2
              exit 1
            fi
          done
          velo-cli --help > /dev/null
          echo "all three binaries load"

      - name: The window starts and stays up
        run: |
          set -u
          export HOME=$(mktemp -d)
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 20 xvfb-run -a velo > velo.log 2>&1
          status=$?
          tail -n 40 velo.log
          # 124 is timeout ending a window that was still running.
          if [ "$status" -ne 124 ]; then
            echo "velo exited on its own with status $status" >&2
            exit 1
          fi
          echo "the window ran for 20 seconds"
